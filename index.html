<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCU</title>
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MCU">
  <link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">

</head>


<body>
<div id="startup">

    <div class="jarvis-reactor"></div>

    <h1>STARK INDUSTRIES</h1>

    <p id="boot-text">
        ARC REACTOR ONLINE
    </p>

</div>

<header>

<div class="logo"></div>

<h1>MCU</h1>

<div class="subtitle">
MISSION CONTROL UNIT
</div>

</header>



<div class="panel">

<h2>STARK SYSTEM STATUS</h2>

<div id="counter">
MISSION STATUS: 0/0
</div>

<br>

<div class="progress">

<div id="bar" class="progress-bar"></div>

</div>

<h3 id="percent">
0%
</h3>


</div>



<div class="panel">

<button onclick="addMission()">
＋ ADD NEW MISSION
</button>

</div>



<div class="panel">

<div id="missions"></div>

</div>



<script src="app.js"></script>


</body>

</html>
