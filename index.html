<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCU - Mission Control Unit</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MCU">
<link rel="apple-touch-icon" href="icon.png">
</head>

<body>

<div id="boot">
<div class="reactor"></div>
<h1>STARK INDUSTRIES</h1>
<p>JARVIS ONLINE</p>
</div>

<div id="app">

<header>
<div class="mini-reactor"></div>
<h1>MCU</h1>
<p>Mission Control Unit</p>
</header>

<nav class="tabs">
<button class="tab active" data-page="home">🏠 Home</button>
<button class="tab" data-page="missions">🎬 Missioni</button>
<button class="tab" data-page="badges">🏆 Badge</button>
<button class="tab" data-page="settings">⚙️</button>
</nav>

<main>

<section id="home" class="page active">

<div class="card">
<h2>Universe Progress</h2>

<div id="rank">RECRUIT</div>

<div id="counter">0 / 0</div>

<div class="progress">
<div id="bar"></div>
</div>

<h3 id="percent">0%</h3>

</div>

<div class="card">

<input
id="search"
type="text"
placeholder="🔎 Cerca missione...">

<button onclick="addMission()">
＋ Nuova Missione
</button>

</div>

</section>

<section id="missions" class="page">
<div id="missionsList"></div>
</section>

<section id="badges" class="page">

<div id="badgesList"></div>

</section>

<section id="settings" class="page">

<div class="card">

<button onclick="resetProgress()">

Reset Progressi

</button>

</div>

</section>

</main>

</div>

<script src="app.js"></script>

</body>
</html>
