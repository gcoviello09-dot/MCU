<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MCU Mission Control Unit</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon.png">

</head>


<body>


<div id="boot">

<div class="reactor"></div>

<h1>STARK INDUSTRIES</h1>

<p>JARVIS ONLINE</p>

</div>



<header>

<div class="mini-reactor"></div>

<h1>MCU</h1>

<p>MISSION CONTROL UNIT</p>

</header>



<nav>

<button data-page="home">🏠</button>

<button data-page="missions">🎬</button>

<button data-page="favorites">⭐</button>

<button data-page="stats">📊</button>

</nav>



<section id="home" class="page active">


<div class="card">

<h2>STATUS</h2>

<h3 id="rank">
RECRUIT
</h3>


<div id="counter">
0 / 0
</div>


<div class="progress">

<div id="bar"></div>

</div>


<h2 id="percent">
0%
</h2>


</div>



<div class="card">

<button onclick="randomMission()">

🎲 JARVIS SCEGLI MISSIONE

</button>


<h3 id="suggestion"></h3>


</div>


</section>



<section id="missions" class="page">


<div class="card">

<input id="search"
placeholder="🔎 Cerca missione">


<button onclick="addMission()">

＋ Nuova Missione

</button>


</div>


<div id="missionsList"></div>
<div id="missionModal" class="modal">

<div class="modal-content">

<button onclick="closeMission()">
❌
</button>

<h2 id="modalTitle"></h2>

<p id="modalInfo"></p>

<button id="modalFavorite">
⭐ Preferito
</button>

</div>

</div>

</section>



<section id="favorites" class="page">


<div class="card">

<h2>⭐ Preferiti</h2>

<div id="favoritesList"></div>

</div>


</section>



<section id="stats" class="page">


<div class="card">

<h2>📊 STATISTICHE</h2>


<p id="movies">
Film: 0
</p>


<p id="series">
Serie: 0
</p>


<p id="completion">
Completamento: 0%
</p>


</div>


<div id="badgesList"></div>


</section>



<script src="app.js"></script>


</body>

</html>
